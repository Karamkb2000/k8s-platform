apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: platform
roleRef:
  kind: Role
  name: api-role
  apiGroup: rbac.authorization.k8s.io
